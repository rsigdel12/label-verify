[project]
name = "label-verify"
version = "0.1.0"
description = "AI-powered label verification prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "pydantic>=2.7.0",
  "rapidfuzz>=3.0.0",
  "python-multipart>=0.0.9",
  "rapidocr>=3.9,<4",
  "onnxruntime>=1.20,<2",
  "opencv-python>=4.10,<6",
  "numpy>=1.26,<3",
  "pytesseract>=0.3.10",
  "pillow>=10.0.0",
  "httpx>=0.27.0",
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.package-data]
"app.extraction" = ["models/*.onnx"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
