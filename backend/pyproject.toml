[project]
name = "label-verify"
version = "0.1.0"
description = "AI-powered label verification prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "pydantic>=2.7.0",
  "rapidfuzz>=3.0.0",
  "python-multipart>=0.0.9",
  "pytesseract>=0.3.10",
  "httpx>=0.27.0",
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
